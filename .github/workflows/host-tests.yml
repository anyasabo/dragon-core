name: host-tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Bambu parser tests
        run: tests/run_bambu_host_test.sh

      - name: Run Prusa freshness tests
        run: tests/run_prusa_host_test.sh

      - name: Run Prusa material parser tests
        run: tests/run_prusa_parse_host_test.sh

      - name: Run timestamp formatter tests
        run: tests/run_time_host_test.sh

      - name: Run Moonraker material-slot selection tests
        run: tests/run_moonraker_material_host_test.sh

      - name: Test Wi-Fi credential boundary validation
        run: tests/run_wifi_validate_host_test.sh

      - name: Test Wi-Fi boot decisions (portal keeps the STA down)
        run: tests/run_wifi_policy_host_test.sh

      - name: Test console snapshot streaming
        run: tests/run_console_stream_host_test.sh

      - name: Test console line assembly for ESP-IDF Log V2
        run: tests/run_evlog_line_host_test.sh

      - name: Run generic PID tests
        run: tests/run_pid_host_test.sh

      - name: Check peer wire contract
        run: tests/run_peer_contract_host_test.sh

      - name: Run syslog format and queue tests
        run: tests/run_syslog_host_test.sh

      - name: Test the bounded portal body read
        run: tests/run_portal_body_host_test.sh

      - name: Check family SPA syntax and capability contract
        run: node tests/check_ui.mjs

      - name: Reject whitespace errors
        run: git diff --check

  sanitizers:
    # Run the host tests again with ASan and UBSan, with gcc and clang. The
    # container has current compilers: ubuntu-latest has gcc-13 and clang-18.
    runs-on: ubuntu-latest
    container: ubuntu:26.10@sha256:29ac5e68db830ab61b7d77c1ffdb78c73f0631de88a5d77bf4399868f64f38dd
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-16, clang-23]
    env:
      CC: ${{ matrix.cc }}
      HOST_TEST_CFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -g
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The clang sanitizer runtimes are in libclang-rt-dev. With
      # --no-install-recommends, apt does not install it with clang.
      - name: Install clang
        # clang needs the libstdc++ headers of the newest GCC. Without
        # libstdc++-16-dev it selects GCC 15 and warns (-Wgcc-install-dir-libstdcxx).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 gcc-16 libstdc++-16-dev libc6-dev
          case "$CC" in clang-*) sh tools/ci/install-llvm.sh "$CC" ;; esac

      - name: Run host tests with sanitizers
        run: |
          for test in tests/run_*_host_test.sh; do
            echo "::group::$test"
            "$test"
            echo "::endgroup::"
          done

  esp-idf-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Compile every shared component together at the minimum supported IDF
      # version. This catches component metadata, public-header, and link-time
      # integration failures that the host-only parser test cannot exercise.
      - name: Build all components (ESP-IDF v5.3, ESP32-C3)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.3
          target: esp32c3
          path: .
          command: tools/idf-build.sh tests/idf-build esp32c3 build

      # ESP-IDF 6 moved cJSON and ESP-MQTT to the component registry and uses
      # Mbed TLS 4. This build keeps the components compatible with it.
      - name: Build all components (ESP-IDF v6.1, ESP32-C3)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v6.1.1
          target: esp32c3
          path: .
          command: tools/idf-build.sh tests/idf-build esp32c3 build-idf6

      # Log V2 compiles the dc_evlog line assembly. With ESP-IDF 6.1, it also
      # uses Picolibc, where Log V2 does not lock between the pieces of a line.
      - name: Build all components with Log V2 (ESP-IDF v6.1, ESP32-C3)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v6.1.1
          target: esp32c3
          path: .
          command: >-
            tools/idf-build.sh tests/idf-build esp32c3 build-log-v2
            -DSDKCONFIG="$PWD/tests/idf-build/build-log-v2/sdkconfig"
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.log-v2"
