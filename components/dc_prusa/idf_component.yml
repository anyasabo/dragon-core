version: "0.35.3"
description: PrusaLink HTTP client and filament-aware chamber control for Dragon firmware
license: MIT
dependencies:
  idf: ">=5.3"
  # ESP-IDF 6 moved cJSON out of the IDF tree. Older IDF versions use the
  # built-in json component (see CMakeLists.txt).
  espressif/cjson:
    version: "^1.7.19"
    require: public # the public header includes cJSON.h
    rules:
      - if: "idf_version >=6.0"
